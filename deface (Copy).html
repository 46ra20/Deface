<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TERMINAL CRITICAL</title>
<style>
    :root {
        --primary: #00ff41;
        --accent: #ff0033;
        --bg: #050505;
    }

    body {
        background: var(--bg);
        color: var(--primary);
        font-family: 'Courier New', monospace;
        height: 100vh;
        margin: 0;
        overflow: hidden;
        /* Screen shake animation applied to everything */
        animation: shake 0.2s infinite;
    }

    /* Severe Glitch Filter */
    #glitch-overlay {
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1), rgba(0,0,0,0.1) 1px, transparent 1px, transparent 2px);
        pointer-events: none;
        z-index: 100;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
        background: radial-gradient(circle, rgba(255,0,51,0.15) 0%, transparent 70%);
    }

    /* Aggressive Glitch Text */
    .title {
        font-size: 6rem;
        font-weight: 900;
        color: #fff;
        text-transform: uppercase;
        position: relative;
        text-shadow: 0.05em 0 0 var(--accent), -0.05em -0.025em 0 #00ffff;
        animation: glitch-vibrate 0.1s infinite;
    }

    .status-box {
        border: 4px solid var(--accent);
        background: rgba(0,0,0,0.8);
        padding: 2rem;
        margin-top: 2rem;
        max-width: 800px;
        box-shadow: 0 0 50px var(--accent);
        transform: skewX(-5deg);
    }

    .warning {
        color: var(--accent);
        font-size: 2rem;
        font-weight: bold;
        text-decoration: underline;
        margin-bottom: 1rem;
        display: block;
    }

    /* Matrix Rain with Red Glitch Shadows */
    canvas {
        position: fixed;
        top: 0; left: 0;
        z-index: -1;
        filter: drop-shadow(0 0 5px var(--accent));
    }

    /* Keyframes for the "Breach" feel */
    @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        25% { transform: translate(-1px, -1px) rotate(-0.5deg); }
        50% { transform: translate(-2px, 0px) rotate(0.5deg); }
        100% { transform: translate(1px, 1px) rotate(0deg); }
    }

    @keyframes glitch-vibrate {
        0% { clip-path: inset(10% 0 30% 0); transform: translate(-5px); }
        20% { clip-path: inset(40% 0 10% 0); transform: translate(5px); }
        40% { clip-path: inset(60% 0 5% 0); transform: translate(-5px); }
        80% { clip-path: inset(15% 0 50% 0); transform: translate(5px); }
        100% { clip-path: inset(10% 0 30% 0); transform: translate(-5px); }
    }

    .stats {
        text-align: left;
        font-size: 1.2rem;
        line-height: 1.8;
    }

    .highlight { color: #fff; background: var(--accent); padding: 0 5px; }
</style>
</head>
<body>

<div id="glitch-overlay"></div>
<canvas id="matrix"></canvas>

<div class="container">
    <h1 class="title">SYSTEM DEAD</h1>
    
    <div class="status-box">
        <span class="warning">!! CORE INTEGRITY FAILURE !!</span>
        <div class="stats">
            > ATTACKER: <span class="highlight">0x_NULL_GHOST</span><br>
            > ACCESS: <span style="color:white">FULL KERNEL PRIVILEGE</span><br>
            > DATA STATE: <span style="color:var(--accent)">DECRYPTING... [84%]</span><br>
            > LOGS: <span style="color:yellow">WIPED</span>
        </div>
    </div>

    <p style="margin-top: 2rem; font-weight: bold; font-size: 1.5rem;">
        YOU HAVE BEEN <span id="flicker">DISCONNECTED</span> PERMANENTLY.
    </p>
</div>

<script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = "☠️☣️⚠️01010101ERROR";
    const fontSize = 20;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function draw() {
        // Very dark transparent black to let the trails last longer
        ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < drops.length; i++) {
            const text = chars[Math.floor(Math.random() * chars.length)];
            
            // Randomly switch between Green and Red for a glitch look
            ctx.fillStyle = Math.random() > 0.9 ? "#ff0033" : "#00ff41";
            ctx.font = fontSize + "px monospace";
            
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);

            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }

    setInterval(draw, 33);

    // Flicker effect for the text
    setInterval(() => {
        document.getElementById('flicker').style.visibility = 
            (Math.random() > 0.1) ? 'visible' : 'hidden';
    }, 50);
</script>

</body>
</html>
